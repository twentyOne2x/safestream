name: knowledge-base-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kb-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run knowledge base checks
        run: python3 scripts/knowledge_check.py
